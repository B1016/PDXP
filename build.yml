              void docx(ZipFile z, ArrayList<CharSequence> out) throws Exception {
                  XmlPullParser p = pp(z.getInputStream(z.getEntry("word/document.xml")));
                  SpannableStringBuilder c = new SpannableStringBuilder();
                  boolean b = false, it = false, bu = false;
                  int tbl = 0, hd = 0;
                  for (int t = p.getEventType(); t != ED && out.size() < 30000; t = p.next()) {
                      if (t == ST) {
                          String n = local(p.getName());
                          switch (n) {
                              case "tbl": tbl++; break;
                              case "r": b = false; it = false; break;
                              case "b": b = !"0".equals(ln(p, "val")) && !"false".equals(ln(p, "val")); break;
                              case "i": it = !"0".equals(ln(p, "val")) && !"false".equals(ln(p, "val")); break;
                              case "numPr": bu = true; break;
                              case "pStyle": {
                                  String v = String.valueOf(ln(p, "val")), dg = v.replaceAll("\\D", "");
                                  if (v.startsWith("Heading") || v.equals("Title")) hd = dg.isEmpty() ? 1 : Integer.parseInt(dg);
                                  break;
                              }
                              case "tab": c.append('\t'); break;
                              case "br": c.append('\n'); break;
                              case "t": {
                                  int s = c.length();
                                  c.append(p.nextText());
                                  if (b) c.setSpan(new StyleSpan(Typeface.BOLD), s, c.length(), X);
                                  if (it) c.setSpan(new StyleSpan(Typeface.ITALIC), s, c.length(), X);
                                  break;
                              }
                          }
                      } else if (t == ET) {
                          String n = local(p.getName());
                          if (n.equals("p")) {
                              if (tbl > 0) { c.append(' '); hd = 0; bu = false; }
                              else {
                                  if (hd > 0 && c.length() > 0) {
                                      c.setSpan(new AbsoluteSizeSpan(hd == 1 ? 26 : hd == 2 ? 22 : 19, true), 0, c.length(), X);
                                      c.setSpan(new StyleSpan(Typeface.BOLD), 0, c.length(), X);
                                  }
                                  if (bu && c.length() > 0) c.insert(0, "\u2022 ");
                                  if (c.length() > 0) out.add(c);
                                  c = new SpannableStringBuilder();
                                  hd = 0;
                                  bu = false;
                              }
                          } else if (n.equals("tc")) c.append("  \u2502  ");
                          else if (n.equals("tr")) { if (c.length() > 0) out.add(c); c = new SpannableStringBuilder(); }
                          else if (n.equals("tbl")) tbl--;
                      }
                  }
              }

              // ---------- XLSX: real grid, sheet tabs, virtualized rows ----------
              void showSheet(File f) {
                  load(f, z -> {
                      ArrayList<String> nm = sheetNames(z);
                      ArrayList<String[]> rs = rows(z, 0);
                      return () -> sheetView(f, nm, rs, 0);
                  });
              }

              ArrayList<String> sheetNames(ZipFile z) throws Exception {
                  ArrayList<String> l = new ArrayList<>();
                  ZipEntry e = z.getEntry("xl/workbook.xml");
                  if (e != null) {
                      XmlPullParser p = pp(z.getInputStream(e));
                      for (int t = p.getEventType(); t != ED; t = p.next()) if (t == ST && local(p.getName()).equals("sheet")) l.add(String.valueOf(at(p, "name")));
                  }
                  return l;
              }

              ArrayList<String[]> rows(ZipFile z, int idx) throws Exception {
                  ArrayList<String> ss = new ArrayList<>();
                  ZipEntry e = z.getEntry("xl/sharedStrings.xml");
                  if (e != null) {
                      XmlPullParser p = pp(z.getInputStream(e));
                      StringBuilder c = new StringBuilder();
                      for (int t = p.getEventType(); t != ED && ss.size() < 500000; t = p.next()) {
                          if (t == ST) {
                              String n = local(p.getName());
                              if (n.equals("si")) c.setLength(0);
                              else if (n.equals("t")) c.append(p.nextText());
                          } else if (t == ET && local(p.getName()).equals("si")) ss.add(c.length() > 150 ? c.substring(0, 150) : c.toString());
                      }
                  }
                  ArrayList<String> files = new ArrayList<>();
                  for (Enumeration<? extends ZipEntry> en = z.entries(); en.hasMoreElements(); ) {
                      String n = en.nextElement().getName();
                      if (n.matches("xl/worksheets/sheet\\d+\\.xml")) files.add(n);
                  }
                  Collections.sort(files, (a, b) -> num(a) - num(b));
                  ArrayList<String[]> out = new ArrayList<>();
                  if (files.isEmpty()) return out;
                  XmlPullParser p = pp(z.getInputStream(z.getEntry(files.get(Math.min(idx, files.size() - 1)))));
                  ArrayList<String> row = new ArrayList<>();
                  String typ = "";
                  int col = 0;
                  for (int t = p.getEventType(); t != ED && out.size() < 5000; t = p.next()) {
                      if (t == ST) {
                          String n = local(p.getName());
                          if (n.equals("row")) {
                              row.clear();
                              String rn = at(p, "r");
                              if (rn != null) while (out.size() < Integer.parseInt(rn) - 1 && out.size() < 5000) out.add(new String[0]);
                          } else if (n.equals("c")) {
                              typ = String.valueOf(at(p, "t"));
                              String r = at(p, "r");
                              col = row.size();
                              if (r != null) {
                                  int cc = 0;
                                  for (int i = 0; i < r.length() && r.charAt(i) >= 'A' && r.charAt(i) <= 'Z'; i++) cc = cc * 26 + r.charAt(i) - 'A' + 1;
                                  if (cc > 0) col = cc - 1;
                              }
                          } else if (n.equals("v") || n.equals("t")) {
                              String v = p.nextText();
                              if (typ.equals("s") && n.equals("v")) try { v = ss.get(Integer.parseInt(v.trim())); } catch (Exception x) { }
                              if (v.length() > 150) v = v.substring(0, 150);
                              if (col < 60) {
                                  while (row.size() <= col) row.add("");
                                  row.set(col, row.get(col) + v);
                              }
                          }
                      } else if (t == ET && local(p.getName()).equals("row")) out.add(row.toArray(new String[0]));
                  }
                  return out;
              }

              static String colName(int c) {
                  String s = "";
                  for (c++; c > 0; c = (c - 1) / 26) s = (char) ('A' + (c - 1) % 26) + s;
                  return s;
              }

              static boolean isNum(String s) {
                  if (s.isEmpty()) return false;
                  char c = s.charAt(0);
                  if (!(c >= '0' && c <= '9' || c == '-' || c == '.')) return false;
                  try { Double.parseDouble(s); return true; } catch (Exception e) { return false; }
              }

              TextView cell(boolean head) {
                  TextView t = tv("", 13, head ? SUB : TX, head);
                  t.setSingleLine();
                  t.setEllipsize(TextUtils.TruncateAt.END);
                  t.setPadding(dp(8), 0, dp(8), 0);
                  t.setGravity(head ? Gravity.CENTER : Gravity.CENTER_VERTICAL);
                  if (head) t.setBackgroundColor(dark ? 0xFF232834 : 0xFFF0F2F7);
                  return t;
              }

              void sheetView(File f, ArrayList<String> nm, ArrayList<String[]> rows, int idx) {
                  int m = 1;
                  for (String[] r : rows) m = Math.max(m, r.length);
                  final int mc = m, cw = dp(110), rh = dp(40), hw = dp(46), tw = hw + cw * mc;
                  GradientDrawable dv = new GradientDrawable();
                  dv.setColor(LINE);
                  dv.setSize(1, 1);
                  LinearLayout hdr = new LinearLayout(this);
                  hdr.setShowDividers(LinearLayout.SHOW_DIVIDER_MIDDLE | LinearLayout.SHOW_DIVIDER_END);
                  hdr.setDividerDrawable(dv);
                  for (int c = 0; c <= mc; c++) {
                      TextView t = cell(true);
                      if (c > 0) t.setText(colName(c - 1));
                      hdr.addView(t, new LinearLayout.LayoutParams(c == 0 ? hw : cw, rh));
                  }
                  ListView lv = new ListView(this);
                  lv.setDivider(dv);
                  lv.setDividerHeight(1);
                  lv.setBackgroundColor(CARD);
                  lv.setFastScrollEnabled(true);
                  lv.setAdapter(new BaseAdapter() {
                      public int getCount() { return rows.size(); }
                      public Object getItem(int i) { return null; }
                      public long getItemId(int i) { return i; }
                      public View getView(int i, View v, ViewGroup g) {
                          LinearLayout r = (LinearLayout) v;
                          if (r == null) {
                              r = new LinearLayout(MainActivity.this);
                              r.setShowDividers(LinearLayout.SHOW_DIVIDER_MIDDLE | LinearLayout.SHOW_DIVIDER_END);
                              r.setDividerDrawable(dv);
                              for (int c = 0; c <= mc; c++) r.addView(cell(c == 0), new LinearLayout.LayoutParams(c == 0 ? hw : cw, rh));
                          }
                          String[] row = rows.get(i);
                          ((TextView) r.getChildAt(0)).setText(String.valueOf(i + 1));
                          for (int c = 0; c < mc; c++) {
                              String s = c < row.length && row[c] != null ? row[c] : "";
                              TextView t = (TextView) r.getChildAt(c + 1);
                              t.setText(s);
                              t.setGravity(Gravity.CENTER_VERTICAL | (isNum(s) ? Gravity.RIGHT : Gravity.LEFT));
                          }
                          return r;
                      }
                  });
                  LinearLayout colm = new LinearLayout(this);
                  colm.setOrientation(LinearLayout.VERTICAL);
                  colm.addView(hdr, new LinearLayout.LayoutParams(tw, rh));
                  colm.addView(lv, new LinearLayout.LayoutParams(tw, 0, 1));
                  HorizontalScrollView hs = new HorizontalScrollView(this);
                  hs.setFillViewport(true);
                  hs.addView(colm, new FrameLayout.LayoutParams(tw, -1));
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.addView(hs, new LinearLayout.LayoutParams(-1, 0, 1));
                  if (nm.size() > 1) {
                      LinearLayout tb = new LinearLayout(this);
                      tb.setPadding(dp(8), dp(6), dp(8), dp(6));
                      for (int k = 0; k < nm.size(); k++) {
                          final int kk = k;
                          TextView t = tv(nm.get(k), 14, k == idx ? Color.WHITE : SUB, true);
                          t.setPadding(dp(16), dp(8), dp(16), dp(8));
                          if (k == idx) t.setBackground(grad(dp(16)));
                          t.setOnClickListener(x -> load(f, z -> { ArrayList<String[]> rr = rows(z, kk); return () -> sheetView(f, nm, rr, kk); }));
                          tb.addView(t);
                      }
                      HorizontalScrollView ts = new HorizontalScrollView(this);
                      ts.setBackgroundColor(CARD);
                      ts.addView(tb);
                      box.addView(ts);
                  }
                  viewer(f.getName(), box);
              }

              // ---------- PPTX: slide-by-slide viewer ----------
              void showDeck(File f) {
                  load(f, z -> {
                      deckZip = z;
                      Deck d = deck(z);
                      return () -> deckView(f, d);
                  });
              }

              Deck deck(ZipFile z) throws Exception {
                  Deck d = new Deck();
                  XmlPullParser p = pp(z.getInputStream(z.getEntry("ppt/presentation.xml")));
                  ArrayList<String> ids = new ArrayList<>();
                  for (int t = p.getEventType(); t != ED; t = p.next()) if (t == ST) {
                      String n = local(p.getName());
                      if (n.equals("sldSz")) { d.sw = Integer.parseInt(ln(p, "cx")); d.sh = Integer.parseInt(ln(p, "cy")); }
                      else if (n.equals("sldId")) ids.add(at(p, "r:id"));
                  }
                  HashMap<String, String> rl = rels(z, "ppt/_rels/presentation.xml.rels");
                  for (String id : ids) { String tg = rl.get(id); if (tg != null) d.sl.add(res("ppt/", tg)); }
                  if (d.sl.isEmpty()) {
                      for (Enumeration<? extends ZipEntry> en = z.entries(); en.hasMoreElements(); ) {
                          String n = en.nextElement().getName();
                          if (n.matches("ppt/slides/slide\\d+\\.xml")) d.sl.add(n);
                      }
                      Collections.sort(d.sl, (a, b) -> num(a) - num(b));
                  }
                  return d;
              }

              Sld slide(ZipFile z, String path) throws Exception {
                  Sld s = new Sld();
                  Sh cur = null;
                  Pa pa = null;
                  boolean inBg = false, inR = false;
                  int sl = path.lastIndexOf('/') + 1;
                  String base = path.substring(0, sl);
                  HashMap<String, String> rl = rels(z, base + "_rels/" + path.substring(sl) + ".rels");
                  XmlPullParser p = pp(z.getInputStream(z.getEntry(path)));
                  for (int t = p.getEventType(); t != ED; t = p.next()) {
                      if (t == ST) {
                          String n = local(p.getName());
                          switch (n) {
                              case "bg": inBg = true; break;
                              case "sp": case "pic": case "graphicFrame": cur = new Sh(); cur.pic = n.equals("pic"); break;
                              case "ph": if (cur != null) { cur.ph = ln(p, "type"); if (cur.ph == null) cur.ph = "body"; } break;
                              case "off": if (cur != null && ln(p, "x") != null) { cur.x = fl(ln(p, "x")); cur.y = fl(ln(p, "y")); } break;
                              case "ext": if (cur != null && ln(p, "cx") != null) { cur.w = fl(ln(p, "cx")); cur.h = fl(ln(p, "cy")); } break;
                              case "blip": if (cur != null) cur.rid = ln(p, "embed"); break;
                              case "p": if (cur != null && !cur.pic) { pa = new Pa(); cur.ps.add(pa); } break;
                              case "pPr":
                                  if (pa != null) {
                                      String a = ln(p, "algn");
                                      pa.set = a != null;
                                      if (a != null) pa.al = a.equals("ctr") ? Layout.Alignment.ALIGN_CENTER : a.equals("r") ? Layout.Alignment.ALIGN_OPPOSITE : Layout.Alignment.ALIGN_NORMAL;
                                  }
                                  break;
                              case "buChar": if (pa != null) pa.bu = true; break;
                              case "rPr":
                                  inR = true;
                                  if (pa != null) {
                                      String sz = ln(p, "sz");
                                      if (sz != null && pa.pt == 0) pa.pt = Integer.parseInt(sz) / 100f;
                                      if ("1".equals(ln(p, "b"))) pa.b = true;
                                  }
                                  break;
                              case "srgbClr": {
                                  String v = ln(p, "val");
                                  if (v != null) {
                                      int c = 0xFF000000 | Integer.parseInt(v, 16);
                                      if (inBg) s.bg = c; else if (inR && pa != null && pa.col == 0) pa.col = c;
                                  }
                                  break;
                              }
                              case "t": if (pa != null) pa.t += p.nextText(); break;
                              case "br": if (pa != null) pa.t += "\n"; break;
                          }
                      } else if (t == ET) {
                          String n = local(p.getName());
                          if (n.equals("rPr")) inR = false;
                          else if (n.equals("bg")) inBg = false;
                          else if (n.equals("sp") || n.equals("pic") || n.equals("graphicFrame")) { if (cur != null) s.sh.add(cur); cur = null; pa = null; }
                      }
                  }
                  for (Sh h : s.sh) if (h.rid != null && rl.get(h.rid) != null) h.bm = bmp(z, z.getEntry(res(base, rl.get(h.rid))));
                  return s;
              }

              static Bitmap bmp(ZipFile z, ZipEntry e) {
                  if (e == null) return null;
                  try {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      try (InputStream in = z.getInputStream(e)) { BitmapFactory.decodeStream(in, null, o); }
                      int sm = 1;
                      while (Math.max(o.outWidth, o.outHeight) / sm > 1024) sm *= 2;
                      o = new BitmapFactory.Options();
                      o.inSampleSize = sm;
                      try (InputStream in = z.getInputStream(e)) { return BitmapFactory.decodeStream(in, null, o); }
                  } catch (Throwable x) { return null; }
              }

              void deckView(File f, Deck d) {
                  dk = d;
                  si = -1;
                  sv = new SV(this, d);
                  FrameLayout stage = new FrameLayout(this);
                  stage.setBackgroundColor(dark ? 0xFF000000 : 0xFFDDE1EA);
                  stage.setPadding(dp(8), dp(8), dp(8), dp(8));
                  stage.addView(sv, new FrameLayout.LayoutParams(-2, -2, Gravity.CENTER));
                  LinearLayout nav = new LinearLayout(this);
                  nav.setGravity(Gravity.CENTER);
                  nav.setBackgroundColor(CARD);
                  TextView pv = tv("\u25C0", 22, A1, true), nx = tv("\u25B6", 22, A1, true);
                  pv.setPadding(dp(28), dp(12), dp(28), dp(12));
                  nx.setPadding(dp(28), dp(12), dp(28), dp(12));
                  cnt = tv("", 15, TX, true);
                  pv.setOnClickListener(x -> go(si - 1));
                  nx.setOnClickListener(x -> go(si + 1));
                  nav.addView(pv);
                  nav.addView(cnt);
                  nav.addView(nx);
                  GestureDetector gd = new GestureDetector(this, new GestureDetector.SimpleOnGestureListener() {
                      @Override public boolean onDown(MotionEvent e) { return true; }
                      @Override public boolean onFling(MotionEvent a, MotionEvent b, float vx, float vy) {
                          if (Math.abs(vx) > 600) go(si + (vx < 0 ? 1 : -1));
                          return true;
                      }
                  });
                  stage.setOnTouchListener((x, ev) -> gd.onTouchEvent(ev));
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.addView(stage, new LinearLayout.LayoutParams(-1, 0, 1));
                  box.addView(nav);
                  viewer(f.getName(), box);
                  go(0);
              }

              void go(int i) {
                  if (dk == null || i < 0 || i >= dk.sl.size()) return;
                  si = i;
                  cnt.setText((i + 1) + " / " + dk.sl.size());
                  final Deck d = dk;
                  final ZipFile z = deckZip;
                  new Thread(() -> {
                      Sld s = null;
                      try { s = slide(z, d.sl.get(i)); } catch (Throwable x) { }
                      final Sld fs = s;
                      runOnUiThread(() -> { if (si == i && dk == d) sv.set(fs); });
                  }).start();
              }

              class SV extends View {
                  Deck d;
                  Sld s;
                  TextPaint tp = new TextPaint(Paint.ANTI_ALIAS_FLAG);

                  SV(Context c, Deck d) { super(c); this.d = d; }

                  @Override protected void onMeasure(int wm, int hm) {
                      int w = MeasureSpec.getSize(wm), h = MeasureSpec.getSize(hm);
                      if (h > 0 && (long) w * d.sh / d.sw > h) w = (int) ((long) h * d.sw / d.sh);
                      setMeasuredDimension(w, (int) ((long) w * d.sh / d.sw));
                  }

                  @Override protected void onSizeChanged(int w, int h, int ow, int oh) { prep(); }

                  void set(Sld n) { s = n; prep(); invalidate(); }

                  float[] box(Sh h) {
                      if (h.w > 0 && h.h > 0) return new float[]{h.x, h.y, h.w, h.h};
                      if (h.pic) return null;
                      String t = String.valueOf(h.ph);
                      float W = d.sw, H = d.sh;
                      if (t.equals("sldNum") || t.equals("dt") || t.equals("ftr")) return null;
                      if (t.equals("title") || t.equals("ctrTitle")) return new float[]{.08f * W, .06f * H, .84f * W, .22f * H};
                      if (t.equals("subTitle")) return new float[]{.08f * W, .32f * H, .84f * W, .2f * H};
                      return new float[]{.08f * W, .3f * H, .84f * W, .6f * H};
                  }

                  void prep() {
                      if (s == null || getWidth() == 0) return;
                      float k = getWidth() / (float) d.sw;
                      int def = lum(s.bg) < 128 ? Color.WHITE : 0xFF222222;
                      for (Sh h : s.sh) {
                          h.lay = null;
                          float[] r = box(h);
                          if (r == null || h.bm != null || h.ps.isEmpty()) continue;
                          SpannableStringBuilder sb = new SpannableStringBuilder();
                          for (Pa a : h.ps) {
                              int st = sb.length();
                              float pt = a.pt > 0 ? a.pt : "title".equals(h.ph) ? 36 : "ctrTitle".equals(h.ph) ? 44 : "subTitle".equals(h.ph) ? 24 : 18;
                              boolean ctr = !a.set && ("ctrTitle".equals(h.ph) || "subTitle".equals(h.ph));
                              if ((a.bu || "body".equals(h.ph)) && a.t.length() > 0) sb.append("\u2022 ");
                              sb.append(a.t).append('\n');
                              int en = sb.length();
                              sb.setSpan(new AbsoluteSizeSpan(Math.max(4, Math.round(pt * 12700 * k)), false), st, en, X);
                              if (a.b || (h.ph != null && h.ph.endsWith("itle"))) sb.setSpan(new StyleSpan(Typeface.BOLD), st, en, X);
                              sb.setSpan(new ForegroundColorSpan(a.col != 0 ? a.col : def), st, en, X);
                              sb.setSpan(new AlignmentSpan.Standard(ctr ? Layout.Alignment.ALIGN_CENTER : a.al), st, en, X);
                          }
                          h.lay = StaticLayout.Builder.obtain(sb, 0, sb.length(), tp, Math.max(1, Math.round(r[2] * k))).build();
                      }
                  }

                  @Override protected void onDraw(Canvas c) {
                      if (s == null) return;
                      float k = getWidth() / (float) d.sw;
                      c.drawColor(s.bg);
                      for (Sh h : s.sh) {
                          float[] r = box(h);
                          if (r == null) continue;
                          if (h.bm != null) c.drawBitmap(h.bm, null, new RectF(r[0] * k, r[1] * k, (r[0] + r[2]) * k, (r[1] + r[3]) * k), tp);
                          else if (h.lay != null) { c.save(); c.translate(r[0] * k, r[1] * k); h.lay.draw(c); c.restore(); }
                      }
                  }
              }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: mv app/build/outputs/apk/debug/app-debug.apk PDXP.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pdxp-${{ github.run_number }}
          name: PDXP build ${{ github.run_number }}
          files: PDXP.apk
