name: Build PDXP APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate PDXP project
        run: |
          mkdir -p app app/src/main app/src/main/java/com/pdxp/reader app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'PDXP'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.pdxp.reader'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.pdxp.reader'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application android:label="PDXP" android:icon="@mipmap/ic_launcher" android:allowBackup="false" android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:mimeType="application/pdf"/>
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document"/>
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"/>
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.presentationml.presentation"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources><color name="pdxp_bg">#2F6FED</color></resources>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/pdxp_bg"/>
              <foreground android:drawable="@drawable/ic_book"/>
          </adaptive-icon>
          EOF
          cat > app/src/main/res/drawable/ic_book.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M52,38C45,32.5 36,31 29,33V72C36,70 45,71.5 52,77Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M56,38C63,32.5 72,31 79,33V72C72,70 63,71.5 56,77Z"/>
          </vector>
          EOF
          cat > app/src/main/java/com/pdxp/reader/MainActivity.java <<'EOF'
          package com.pdxp.reader;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.res.Configuration;
          import android.graphics.*;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.pdf.PdfRenderer;
          import android.net.Uri;
          import android.os.*;
          import android.provider.Settings;
          import android.text.*;
          import android.text.format.DateFormat;
          import android.text.format.Formatter;
          import android.text.style.*;
          import android.util.LruCache;
          import android.util.TypedValue;
          import android.util.Xml;
          import android.view.*;
          import android.widget.*;
          import java.io.*;
          import java.util.*;
          import java.util.concurrent.*;
          import java.util.zip.*;
          import org.xmlpull.v1.XmlPullParser;

          public class MainActivity extends Activity {
              static final int A1 = 0xFF4F7CFF, A2 = 0xFF8E54E9, ED = 1, ST = 2, ET = 3, X = Spanned.SPAN_EXCLUSIVE_EXCLUSIVE;
              interface Job { Runnable run(ZipFile z) throws Throwable; }
              static class E { String p, n, x; long s, m; boolean d; }
              static class Pa { String t = ""; float pt; boolean b, bu, set; int col; Layout.Alignment al = Layout.Alignment.ALIGN_NORMAL; }
              static class Sh { float x, y, w, h; boolean pic; String ph, rid; ArrayList<Pa> ps = new ArrayList<>(); Bitmap bm; StaticLayout lay; }
              static class Sld { ArrayList<Sh> sh = new ArrayList<>(); int bg = 0xFFFFFFFF; }
              static class Deck { int sw = 9144000, sh = 5143500; ArrayList<String> sl = new ArrayList<>(); }

              boolean dark, libTab = true, viewing, scanning, scanned;
              int BG, CARD, TX, SUB, LINE, si;
              SharedPreferences sp;
              LinearLayout root;
              ListView list;
              TextView title, sub, empty, tabLib, tabBrowse, cnt;
              ArrayList<E> lib = new ArrayList<>(), items = new ArrayList<>();
              ConcurrentHashMap<String, E> idx = new ConcurrentHashMap<>();
              File top = Environment.getExternalStorageDirectory(), dir = top;
              PdfRenderer pdf;
              ExecutorService ex;
              ZipFile deckZip;
              Deck dk;
              SV sv;

              BaseAdapter ad = new BaseAdapter() {
                  public int getCount() { return items.size(); }
                  public Object getItem(int i) { return null; }
                  public long getItemId(int i) { return i; }
                  public View getView(int i, View v, ViewGroup g) {
                      if (v == null) {
                          FrameLayout w = new FrameLayout(MainActivity.this);
                          w.setPadding(0, dp(4), 0, dp(4));
                          LinearLayout r = new LinearLayout(MainActivity.this);
                          r.setGravity(Gravity.CENTER_VERTICAL);
                          r.setPadding(dp(12), dp(12), dp(12), dp(12));
                          r.setBackground(rect(CARD, dp(18)));
                          TextView bd = tv("", 12, Color.WHITE, true);
                          bd.setGravity(Gravity.CENTER);
                          r.addView(bd, new LinearLayout.LayoutParams(dp(48), dp(48)));
                          LinearLayout c = new LinearLayout(MainActivity.this);
                          c.setOrientation(LinearLayout.VERTICAL);
                          c.setPadding(dp(14), 0, 0, 0);
                          TextView n = tv("", 15, TX, true);
                          n.setMaxLines(2);
                          n.setEllipsize(TextUtils.TruncateAt.END);
                          c.addView(n);
                          c.addView(tv("", 12, SUB, false));
                          r.addView(c, new LinearLayout.LayoutParams(0, -2, 1));
                          w.addView(r);
                          v = w;
                      }
                      E e = items.get(i);
                      LinearLayout r = (LinearLayout) ((FrameLayout) v).getChildAt(0);
                      TextView bd = (TextView) r.getChildAt(0);
                      LinearLayout c = (LinearLayout) r.getChildAt(1);
                      bd.setText(e.d ? "DIR" : e.x.toUpperCase(Locale.ROOT));
                      bd.setBackground(badge(e));
                      ((TextView) c.getChildAt(0)).setText(e.n);
                      ((TextView) c.getChildAt(1)).setText(e.d ? "Folder" : Formatter.formatShortFileSize(MainActivity.this, e.s) + "  \u2022  " + DateFormat.format("dd MMM yyyy", e.m));
                      return v;
                  }
              };

              @Override protected void onCreate(Bundle st) {
                  super.onCreate(st);
                  sp = getSharedPreferences("p", 0);
                  dark = sp.getBoolean("dark", (getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES);
                  BG = dark ? 0xFF0F1115 : 0xFFF4F6FB;
                  CARD = dark ? 0xFF1B1F27 : Color.WHITE;
                  TX = dark ? 0xFFEDEFF3 : 0xFF1B1E25;
                  SUB = dark ? 0xFF9AA3B2 : 0xFF6B7280;
                  LINE = dark ? 0xFF2C323D : 0xFFDDE1EA;
                  getWindow().setStatusBarColor(A1);
                  getWindow().setNavigationBarColor(CARD);
                  if (!dark) getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);
                  LinearLayout hd = new LinearLayout(this);
                  hd.setOrientation(LinearLayout.VERTICAL);
                  GradientDrawable hg = new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{A1, A2});
                  float rr = dp(24);
                  hg.setCornerRadii(new float[]{0, 0, 0, 0, rr, rr, rr, rr});
                  hd.setBackground(hg);
                  hd.setPadding(dp(20), dp(14), dp(8), dp(20));
                  LinearLayout row = new LinearLayout(this);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  title = tv("PDXP", 26, Color.WHITE, true);
                  row.addView(title, new LinearLayout.LayoutParams(0, -2, 1));
                  row.addView(ic(dark ? "\u2600" : "\u263E", v -> { sp.edit().putBoolean("dark", !dark).apply(); recreate(); }));
                  row.addView(ic("\u27F3", v -> { if (access()) scan(); else ask(); }));
                  row.addView(ic("\uFF0B", v -> startActivityForResult(new Intent(Intent.ACTION_OPEN_DOCUMENT).addCategory(Intent.CATEGORY_OPENABLE).setType("*/*"), 2)));
                  sub = tv("", 13, 0xCCFFFFFF, false);
                  hd.addView(row);
                  hd.addView(sub);
                  list = new ListView(this);
                  list.setDividerHeight(0);
                  list.setFastScrollEnabled(true);
                  list.setClipToPadding(false);
                  list.setPadding(dp(12), dp(10), dp(12), dp(10));
                  list.setSelector(new ColorDrawable(0));
                  list.setAdapter(ad);
                  list.setOnItemClickListener((a, v, i, id) -> open(items.get(i)));
                  empty = tv("", 16, SUB, false);
                  empty.setGravity(Gravity.CENTER);
                  empty.setPadding(dp(24), dp(24), dp(24), dp(24));
                  empty.setOnClickListener(v -> { if (!access()) ask(); });
                  FrameLayout body = new FrameLayout(this);
                  body.addView(list);
                  body.addView(empty);
                  list.setEmptyView(empty);
                  LinearLayout tabs = new LinearLayout(this);
                  tabs.setBackgroundColor(CARD);
                  tabs.setPadding(dp(16), dp(8), dp(16), dp(8));
                  tabLib = tab("Library");
                  tabBrowse = tab("Browse");
                  tabLib.setOnClickListener(v -> { libTab = true; refresh(); });
                  tabBrowse.setOnClickListener(v -> { libTab = false; refresh(); });
                  tabs.addView(tabLib, wt());
                  tabs.addView(tabBrowse, wt());
                  root.addView(hd);
                  root.addView(body, new LinearLayout.LayoutParams(-1, 0, 1));
                  root.addView(tabs);
                  try (BufferedReader br = new BufferedReader(new FileReader(new File(getFilesDir(), "lib.tsv")))) {
                      for (String l; (l = br.readLine()) != null; ) {
                          String[] a = l.split("\t");
                          if (a.length == 3) { E e = mk(a[0], Long.parseLong(a[1]), Long.parseLong(a[2])); lib.add(e); idx.put(e.p, e); }
                      }
                  } catch (Exception x) { }
                  sortLib();
                  setContentView(root);
                  refresh();
                  Uri u = getIntent().getData();
                  if (u != null) openUri(u);
              }

              @Override protected void onResume() {
                  super.onResume();
                  if (!viewing && !scanned && access()) { scanned = true; scan(); }
                  else if (!viewing) refresh();
              }

              @Override protected void onDestroy() { closeAll(); super.onDestroy(); }

              TextView tv(String s, int sz, int col, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sz);
                  t.setTextColor(col);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              TextView ic(String s, View.OnClickListener l) {
                  TextView t = tv(s, 22, Color.WHITE, false);
                  t.setPadding(dp(10), dp(6), dp(10), dp(6));
                  t.setOnClickListener(l);
                  return t;
              }

              TextView tab(String s) {
                  TextView t = tv(s, 15, SUB, true);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(0, dp(11), 0, dp(11));
                  return t;
              }

              LinearLayout.LayoutParams wt() {
                  LinearLayout.LayoutParams l = new LinearLayout.LayoutParams(0, -2, 1);
                  l.setMargins(dp(4), 0, dp(4), 0);
                  return l;
              }

              GradientDrawable grad(int r) {
                  GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT, new int[]{A1, A2});
                  g.setCornerRadius(r);
                  return g;
              }

              GradientDrawable rect(int c, int r) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(c);
                  g.setCornerRadius(r);
                  return g;
              }

              GradientDrawable badge(E e) {
                  int[] c = e.d ? new int[]{0xFFB0BEC5, 0xFF78909C} : e.x.equals("pdf") ? new int[]{0xFFFF7A7A, 0xFFE53935}
                      : e.x.equals("docx") ? new int[]{0xFF6AA6FF, 0xFF1E6FD9} : e.x.equals("xlsx") ? new int[]{0xFF5BE08A, 0xFF1F9D55} : new int[]{0xFFFFB74D, 0xFFF57C00};
                  GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.TL_BR, c);
                  g.setCornerRadius(dp(14));
                  return g;
              }

              int dp(int v) { return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics()); }

              void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_SHORT).show(); }

              static String ext(String n) { int i = n.lastIndexOf('.'); return i < 0 ? "" : n.substring(i + 1).toLowerCase(Locale.ROOT); }

              static boolean ok(String e) { return e.equals("pdf") || e.equals("docx") || e.equals("xlsx") || e.equals("pptx"); }

              static E mk(String p, long s, long m) {
                  E e = new E();
                  e.p = p;
                  e.n = p.substring(p.lastIndexOf('/') + 1);
                  e.x = ext(e.n);
                  e.s = s;
                  e.m = m;
                  return e;
              }

              boolean access() {
                  return Build.VERSION.SDK_INT >= 30 ? Environment.isExternalStorageManager()
                      : checkSelfPermission("android.permission.READ_EXTERNAL_STORAGE") == PackageManager.PERMISSION_GRANTED;
              }

              void ask() {
                  if (Build.VERSION.SDK_INT >= 30)
                      startActivity(new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + getPackageName())));
                  else requestPermissions(new String[]{"android.permission.READ_EXTERNAL_STORAGE"}, 1);
              }

              @Override public void onRequestPermissionsResult(int c, String[] p, int[] r) { if (access() && !scanned) { scanned = true; scan(); } }

              @Override protected void onActivityResult(int rc, int res, Intent d) {
                  if (rc == 2 && res == RESULT_OK && d != null && d.getData() != null) openUri(d.getData());
              }

              void sortLib() { Collections.sort(lib, (a, b) -> Long.compare(b.m, a.m)); }

              void save() {
                  StringBuilder sb = new StringBuilder();
                  for (E e : lib) sb.append(e.p).append('\t').append(e.s).append('\t').append(e.m).append('\n');
                  new Thread(() -> { try (FileWriter w = new FileWriter(new File(getFilesDir(), "lib.tsv"))) { w.write(sb.toString()); } catch (Exception x) { } }).start();
              }

              void scan() {
                  if (scanning) return;
                  scanning = true;
                  refresh();
                  new Thread(() -> {
                      HashSet<String> seen = new HashSet<>();
                      walk(top, seen, 0);
                      runOnUiThread(() -> {
                          for (Iterator<E> it = lib.iterator(); it.hasNext(); ) {
                              E e = it.next();
                              if (!seen.contains(e.p)) { it.remove(); idx.remove(e.p); }
                          }
                          scanning = false;
                          refresh();
                          save();
                      });
                  }).start();
              }

              void walk(File d, HashSet<String> seen, int depth) {
                  File[] fs = d.listFiles();
                  if (fs == null || depth > 12) return;
                  ArrayList<E> fresh = new ArrayList<>();
                  ArrayList<File> dirs = new ArrayList<>();
                  for (File f : fs) {
                      String n = f.getName();
                      if (n.startsWith(".")) continue;
                      if (f.isDirectory()) { if (!(depth == 0 && n.equals("Android"))) dirs.add(f); }
                      else if (ok(ext(n))) {
                          String p = f.getPath();
                          seen.add(p);
                          E e = idx.get(p);
                          long sz = f.length(), mt = f.lastModified();
                          if (e == null || e.s != sz || e.m != mt) fresh.add(mk(p, sz, mt));
                      }
                  }
                  if (!fresh.isEmpty()) runOnUiThread(() -> {
                      for (E e : fresh) { E old = idx.put(e.p, e); if (old != null) lib.remove(old); lib.add(e); }
                      sortLib();
                      if (libTab) refresh();
                  });
                  for (File f : dirs) walk(f, seen, depth + 1);
              }

              ArrayList<E> listDir() {
                  ArrayList<E> o = new ArrayList<>();
                  File[] fs = dir.listFiles();
                  if (fs != null) for (File f : fs) {
                      String n = f.getName();
                      if (n.startsWith(".")) continue;
                      boolean d = f.isDirectory();
                      if (d || ok(ext(n))) { E e = mk(f.getPath(), f.length(), f.lastModified()); e.d = d; o.add(e); }
                  }
                  Collections.sort(o, (a, b) -> a.d != b.d ? (a.d ? -1 : 1) : a.n.compareToIgnoreCase(b.n));
                  return o;
              }

              void refresh() {
                  items = libTab ? lib : listDir();
                  title.setText(libTab || dir.equals(top) ? "PDXP" : dir.getName());
                  sub.setText(libTab ? (scanning ? "Scanning\u2026  " : "") + lib.size() + " documents" : dir.getPath());
                  for (int k = 0; k < 2; k++) {
                      TextView t = k == 0 ? tabLib : tabBrowse;
                      boolean on = (k == 0) == libTab;
                      t.setBackground(on ? grad(dp(20)) : null);
                      t.setTextColor(on ? Color.WHITE : SUB);
                  }
                  empty.setText(scanning ? "Scanning\u2026" : access() ? "No documents here" : "No documents found.\nTap to allow file access.");
                  ad.notifyDataSetChanged();
              }

              void open(E e) {
                  if (e.d) { dir = new File(e.p); refresh(); list.setSelection(0); }
                  else openFile(new File(e.p));
              }

              void openFile(File f) {
                  String e = ext(f.getName());
                  if (!f.exists()) { toast("File not found"); return; }
                  if (e.equals("pdf")) showPdf(f);
                  else if (e.equals("docx")) showDoc(f);
                  else if (e.equals("xlsx")) showSheet(f);
                  else if (e.equals("pptx")) showDeck(f);
              }

              void openUri(Uri u) {
                  String t = String.valueOf(getContentResolver().getType(u)), n = String.valueOf(u.getLastPathSegment()).toLowerCase(Locale.ROOT);
                  String e = t.contains("pdf") || n.endsWith(".pdf") ? "pdf"
                      : t.contains("wordprocessingml") || n.endsWith(".docx") ? "docx"
                      : t.contains("spreadsheetml") || n.endsWith(".xlsx") ? "xlsx"
                      : t.contains("presentationml") || n.endsWith(".pptx") ? "pptx" : "";
                  if (e.isEmpty()) { toast("Unsupported file"); return; }
                  File tmp = new File(getCacheDir(), "open." + e);
                  new Thread(() -> {
                      try (InputStream in = getContentResolver().openInputStream(u); OutputStream o = new FileOutputStream(tmp)) {
                          byte[] buf = new byte[16384];
                          int k;
                          while ((k = in.read(buf)) > 0) o.write(buf, 0, k);
                          runOnUiThread(() -> { closeAll(); openFile(tmp); });
                      } catch (Exception x) { runOnUiThread(() -> toast("Can't open file")); }
                  }).start();
              }

              void viewer(String name, View content) {
                  viewing = true;
                  LinearLayout v = new LinearLayout(this);
                  v.setOrientation(LinearLayout.VERTICAL);
                  v.setBackgroundColor(BG);
                  TextView bar = tv("\u2190   " + name, 17, Color.WHITE, true);
                  bar.setBackground(grad(0));
                  bar.setPadding(dp(16), dp(15), dp(16), dp(15));
                  bar.setSingleLine();
                  bar.setEllipsize(TextUtils.TruncateAt.END);
                  bar.setOnClickListener(x -> onBackPressed());
                  v.addView(bar);
                  v.addView(content, new LinearLayout.LayoutParams(-1, 0, 1));
                  setContentView(v);
              }

              void closeAll() {
                  if (ex != null) { ex.shutdownNow(); ex = null; }
                  if (pdf != null) synchronized (pdf) { try { pdf.close(); } catch (Exception e) { } pdf = null; }
                  if (deckZip != null) { try { deckZip.close(); } catch (Exception e) { } deckZip = null; }
                  dk = null;
              }

              @Override public void onBackPressed() {
                  if (viewing) { viewing = false; closeAll(); setContentView(root); }
                  else if (!libTab && !dir.equals(top) && dir.getParentFile() != null) { dir = dir.getParentFile(); refresh(); }
                  else super.onBackPressed();
              }

              void load(File f, Job j) {
                  TextView ld = tv("Loading\u2026", 16, SUB, false);
                  ld.setGravity(Gravity.CENTER);
                  viewer(f.getName(), ld);
                  new Thread(() -> {
                      ZipFile z = null;
                      Runnable r;
                      try { z = new ZipFile(f); r = j.run(z); }
                      catch (Throwable x) { r = () -> { toast(x instanceof OutOfMemoryError ? "File too large for this device" : "Can't read this file"); onBackPressed(); }; }
                      if (z != null && z != deckZip) try { z.close(); } catch (Exception e) { }
                      final Runnable fr = r;
                      runOnUiThread(() -> { if (viewing) fr.run(); });
                  }).start();
              }

              // ---------- PDF ----------
              void showPdf(File f) {
                  closeAll();
                  final PdfRenderer r;
                  final float ratio;
                  try {
                      r = new PdfRenderer(ParcelFileDescriptor.open(f, ParcelFileDescriptor.MODE_READ_ONLY));
                      PdfRenderer.Page g = r.openPage(0);
                      ratio = g.getHeight() / (float) g.getWidth();
                      g.close();
                  } catch (Throwable e) { toast("Can't open this PDF"); return; }
                  pdf = r;
                  ex = Executors.newSingleThreadExecutor();
                  final ExecutorService xs = ex;
                  final int sw = getResources().getDisplayMetrics().widthPixels, W = Math.min(sw, 1000), mh = (int) (sw * ratio), cn = r.getPageCount();
                  final LruCache<Integer, Bitmap> cache = new LruCache<>(6);
                  ListView lv = new ListView(this);
                  lv.setBackgroundColor(BG);
                  lv.setDivider(new ColorDrawable(BG));
                  lv.setDividerHeight(dp(8));
                  lv.setFastScrollEnabled(true);
                  lv.setAdapter(new BaseAdapter() {
                      public int getCount() { return cn; }
                      public Object getItem(int i) { return null; }
                      public long getItemId(int i) { return i; }
                      public View getView(final int i, View v, ViewGroup g) {
                          final ImageView iv = v == null ? new ImageView(MainActivity.this) : (ImageView) v;
                          if (v == null) { iv.setAdjustViewBounds(true); iv.setLayoutParams(new AbsListView.LayoutParams(-1, -2)); }
                          iv.setTag(i);
                          iv.setMinimumHeight(mh);
                          Bitmap c = cache.get(i);
                          iv.setImageBitmap(c);
                          if (c == null) try {
                              xs.execute(() -> {
                                  if (!Integer.valueOf(i).equals(iv.getTag())) return;
                                  final Bitmap[] o = {null};
                                  synchronized (r) {
                                      if (pdf != r) return;
                                      try {
                                          PdfRenderer.Page pg = r.openPage(i);
                                          int h = W * pg.getHeight() / pg.getWidth();
                                          o[0] = Bitmap.createBitmap(W, h, Bitmap.Config.RGB_565);
                                          o[0].eraseColor(Color.WHITE);
                                          pg.render(o[0], null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY);
                                          pg.close();
                                      } catch (Throwable x) { return; }
                                  }
                                  cache.put(i, o[0]);
                                  runOnUiThread(() -> { if (Integer.valueOf(i).equals(iv.getTag())) iv.setImageBitmap(o[0]); });
                              });
                          } catch (Exception x) { }
                          return iv;
                      }
                  });
                  viewer(f.getName(), lv);
              }

              // ---------- shared XML helpers ----------
              static String local(String n) { int i = n.indexOf(':'); return i < 0 ? n : n.substring(i + 1); }

              static String at(XmlPullParser p, String k) { return p.getAttributeValue(null, k); }

              static String ln(XmlPullParser p, String k) {
                  for (int i = 0; i < p.getAttributeCount(); i++) if (local(p.getAttributeName(i)).equals(k)) return p.getAttributeValue(i);
                  return null;
              }

              static XmlPullParser pp(InputStream in) throws Exception {
                  XmlPullParser p = Xml.newPullParser();
                  p.setInput(in, null);
                  return p;
              }

              static int num(String n) { return Integer.parseInt(n.replaceAll("\\D", "")); }

              static float fl(String v) { return Float.parseFloat(v); }

              static int lum(int c) { return (Color.red(c) * 299 + Color.green(c) * 587 + Color.blue(c) * 114) / 1000; }

              HashMap<String, String> rels(ZipFile z, String path) {
                  HashMap<String, String> m = new HashMap<>();
                  try {
                      ZipEntry e = z.getEntry(path);
                      if (e == null) return m;
                      XmlPullParser p = pp(z.getInputStream(e));
                      for (int t = p.getEventType(); t != ED; t = p.next()) if (t == ST && local(p.getName()).equals("Relationship")) m.put(at(p, "Id"), at(p, "Target"));
                  } catch (Exception x) { }
                  return m;
              }

              static String res(String base, String t) {
                  if (t.startsWith("/")) return t.substring(1);
                  while (t.startsWith("../")) { t = t.substring(3); base = base.substring(0, base.lastIndexOf('/', base.length() - 2) + 1); }
                  return base + t;
              }

