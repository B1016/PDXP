name: Build PDXP APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate PDXP project
        run: |
          mkdir -p app app/src/main app/src/main/java/com/pdxp/reader app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 app/src/main/res/values
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'PDXP'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.pdxp.reader'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.pdxp.reader'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application android:label="PDXP" android:icon="@mipmap/ic_launcher" android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:mimeType="application/pdf"/>
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document"/>
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"/>
                          <data android:mimeType="application/vnd.openxmlformats-officedocument.presentationml.presentation"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources><color name="pdxp_bg">#2F6FED</color></resources>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/pdxp_bg"/>
              <foreground android:drawable="@drawable/ic_book"/>
          </adaptive-icon>
          EOF
          cat > app/src/main/res/drawable/ic_book.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M52,38C45,32.5 36,31 29,33V72C36,70 45,71.5 52,77Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M56,38C63,32.5 72,31 79,33V72C72,70 63,71.5 56,77Z"/>
          </vector>
          EOF
          cat > app/src/main/java/com/pdxp/reader/MainActivity.java <<'EOF'
          package com.pdxp.reader;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.pdf.PdfRenderer;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.ParcelFileDescriptor;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.text.format.DateFormat;
          import android.text.format.Formatter;
          import android.util.TypedValue;
          import android.util.Xml;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.*;
          import java.io.*;
          import java.util.*;
          import java.util.zip.*;
          import org.xmlpull.v1.XmlPullParser;

          public class MainActivity extends Activity {
              static final int ACC = 0xFF2F6FED;
              LinearLayout root;
              ListView list;
              TextView title, empty, tabLib, tabBrowse;
              ArrayList<File> lib = new ArrayList<>(), items = new ArrayList<>();
              File top = Environment.getExternalStorageDirectory(), dir = top;
              boolean libTab = true, viewing, scanning;
              PdfRenderer pdf;

              BaseAdapter ad = new BaseAdapter() {
                  public int getCount() { return items.size(); }
                  public Object getItem(int i) { return null; }
                  public long getItemId(int i) { return i; }
                  public View getView(int i, View v, ViewGroup p) {
                      if (v == null) {
                          LinearLayout r = new LinearLayout(MainActivity.this);
                          r.setGravity(Gravity.CENTER_VERTICAL);
                          r.setPadding(dp(16), dp(10), dp(16), dp(10));
                          TextView bd = tv("", 12, Color.WHITE, true);
                          bd.setGravity(Gravity.CENTER);
                          r.addView(bd, new LinearLayout.LayoutParams(dp(46), dp(46)));
                          LinearLayout c = new LinearLayout(MainActivity.this);
                          c.setOrientation(LinearLayout.VERTICAL);
                          c.setPadding(dp(14), 0, 0, 0);
                          TextView n = tv("", 16, 0xFF111111, false);
                          n.setMaxLines(2);
                          n.setEllipsize(TextUtils.TruncateAt.END);
                          c.addView(n);
                          c.addView(tv("", 12, 0xFF777777, false));
                          r.addView(c, new LinearLayout.LayoutParams(0, -2, 1));
                          v = r;
                      }
                      File f = items.get(i);
                      LinearLayout r = (LinearLayout) v;
                      TextView bd = (TextView) r.getChildAt(0);
                      LinearLayout c = (LinearLayout) r.getChildAt(1);
                      boolean d = f.isDirectory();
                      String e = ext(f.getName());
                      bd.setText(d ? "DIR" : e.toUpperCase(Locale.ROOT));
                      GradientDrawable g = new GradientDrawable();
                      g.setCornerRadius(dp(8));
                      g.setColor(d ? 0xFF90A4AE : e.equals("pdf") ? 0xFFE53935 : e.equals("docx") ? 0xFF1E6FD9 : e.equals("xlsx") ? 0xFF2E9B57 : 0xFFF57C00);
                      bd.setBackground(g);
                      ((TextView) c.getChildAt(0)).setText(f.getName());
                      ((TextView) c.getChildAt(1)).setText(d ? "Folder" : Formatter.formatShortFileSize(MainActivity.this, f.length()) + "  \u2022  " + DateFormat.format("dd MMM yyyy", f.lastModified()));
                      return v;
                  }
              };

              @Override protected void onCreate(Bundle st) {
                  super.onCreate(st);
                  getWindow().setStatusBarColor(ACC);
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.WHITE);
                  LinearLayout bar = new LinearLayout(this);
                  bar.setBackgroundColor(ACC);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setPadding(dp(16), dp(14), dp(16), dp(14));
                  title = tv("PDXP", 20, Color.WHITE, true);
                  TextView openBtn = tv("OPEN", 14, Color.WHITE, true);
                  openBtn.setOnClickListener(v -> startActivityForResult(new Intent(Intent.ACTION_OPEN_DOCUMENT).addCategory(Intent.CATEGORY_OPENABLE).setType("*/*"), 2));
                  bar.addView(title, new LinearLayout.LayoutParams(0, -2, 1));
                  bar.addView(openBtn);
                  list = new ListView(this);
                  list.setDividerHeight(0);
                  list.setFastScrollEnabled(true);
                  list.setAdapter(ad);
                  list.setOnItemClickListener((a, v, i, id) -> open(items.get(i)));
                  empty = tv("", 16, 0xFF666666, false);
                  empty.setGravity(Gravity.CENTER);
                  empty.setPadding(dp(24), dp(24), dp(24), dp(24));
                  empty.setOnClickListener(v -> { if (!access()) ask(); });
                  FrameLayout body = new FrameLayout(this);
                  body.addView(list);
                  body.addView(empty);
                  list.setEmptyView(empty);
                  LinearLayout tabs = new LinearLayout(this);
                  tabs.setBackgroundColor(0xFFF3F4F6);
                  tabLib = tab("Library");
                  tabBrowse = tab("Browse");
                  tabLib.setOnClickListener(v -> { libTab = true; refresh(); });
                  tabBrowse.setOnClickListener(v -> { libTab = false; refresh(); });
                  tabs.addView(tabLib, new LinearLayout.LayoutParams(0, -2, 1));
                  tabs.addView(tabBrowse, new LinearLayout.LayoutParams(0, -2, 1));
                  root.addView(bar);
                  root.addView(body, new LinearLayout.LayoutParams(-1, 0, 1));
                  root.addView(tabs);
                  setContentView(root);
                  refresh();
                  Uri u = getIntent().getData();
                  if (u != null) openUri(u);
              }

              @Override protected void onResume() {
                  super.onResume();
                  if (!viewing && lib.isEmpty() && !scanning && access()) scan();
              }

              TextView tv(String s, int sp, int col, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(col);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              TextView tab(String s) {
                  TextView t = tv(s, 15, 0xFF777777, true);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(0, dp(14), 0, dp(14));
                  return t;
              }

              int dp(int v) { return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics()); }

              void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_SHORT).show(); }

              static String ext(String n) { int i = n.lastIndexOf('.'); return i < 0 ? "" : n.substring(i + 1).toLowerCase(Locale.ROOT); }

              static boolean ok(String e) { return e.equals("pdf") || e.equals("docx") || e.equals("xlsx") || e.equals("pptx"); }

              boolean access() {
                  return Build.VERSION.SDK_INT >= 30 ? Environment.isExternalStorageManager()
                      : checkSelfPermission("android.permission.READ_EXTERNAL_STORAGE") == PackageManager.PERMISSION_GRANTED;
              }

              void ask() {
                  if (Build.VERSION.SDK_INT >= 30)
                      startActivity(new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + getPackageName())));
                  else requestPermissions(new String[]{"android.permission.READ_EXTERNAL_STORAGE"}, 1);
              }

              @Override public void onRequestPermissionsResult(int c, String[] p, int[] r) { if (access()) scan(); }

              @Override protected void onActivityResult(int rc, int res, Intent d) {
                  if (rc == 2 && res == RESULT_OK && d != null && d.getData() != null) openUri(d.getData());
              }

              void scan() {
                  scanning = true;
                  refresh();
                  new Thread(() -> {
                      ArrayList<File> out = new ArrayList<>();
                      walk(top, out, 0);
                      Collections.sort(out, (a, b) -> Long.compare(b.lastModified(), a.lastModified()));
                      runOnUiThread(() -> { lib = out; scanning = false; refresh(); });
                  }).start();
              }

              void walk(File d, ArrayList<File> out, int depth) {
                  File[] fs = d.listFiles();
                  if (fs == null || depth > 12) return;
                  for (File f : fs) {
                      String n = f.getName();
                      if (n.startsWith(".")) continue;
                      if (f.isDirectory()) { if (!(depth == 0 && n.equals("Android"))) walk(f, out, depth + 1); }
                      else if (ok(ext(n))) out.add(f);
                  }
              }

              ArrayList<File> listDir() {
                  ArrayList<File> o = new ArrayList<>();
                  File[] fs = dir.listFiles();
                  if (fs != null) for (File f : fs) if (!f.getName().startsWith(".") && (f.isDirectory() || ok(ext(f.getName())))) o.add(f);
                  Collections.sort(o, (a, b) -> a.isDirectory() != b.isDirectory() ? (a.isDirectory() ? -1 : 1) : a.getName().compareToIgnoreCase(b.getName()));
                  return o;
              }

              void refresh() {
                  items = libTab ? lib : listDir();
                  title.setText(libTab ? "PDXP" : dir.equals(top) ? "Browse" : dir.getName());
                  tabLib.setTextColor(libTab ? ACC : 0xFF777777);
                  tabBrowse.setTextColor(libTab ? 0xFF777777 : ACC);
                  empty.setText(scanning ? "Scanning\u2026" : access() ? "No documents here" : "No documents found.\nTap to allow file access.");
                  ad.notifyDataSetChanged();
              }

              void open(File f) {
                  if (f.isDirectory()) { dir = f; refresh(); list.setSelection(0); return; }
                  String e = ext(f.getName());
                  if (e.equals("pdf")) showPdf(f); else showText(f, e);
              }

              void openUri(Uri u) {
                  String t = String.valueOf(getContentResolver().getType(u)), n = String.valueOf(u.getLastPathSegment()).toLowerCase(Locale.ROOT);
                  String e = t.contains("pdf") || n.endsWith(".pdf") ? "pdf"
                      : t.contains("wordprocessingml") || n.endsWith(".docx") ? "docx"
                      : t.contains("spreadsheetml") || n.endsWith(".xlsx") ? "xlsx"
                      : t.contains("presentationml") || n.endsWith(".pptx") ? "pptx" : "";
                  if (e.isEmpty()) { toast("Unsupported file"); return; }
                  File tmp = new File(getCacheDir(), "open." + e);
                  new Thread(() -> {
                      try (InputStream in = getContentResolver().openInputStream(u); OutputStream o = new FileOutputStream(tmp)) {
                          byte[] buf = new byte[16384];
                          int k;
                          while ((k = in.read(buf)) > 0) o.write(buf, 0, k);
                          runOnUiThread(() -> { closePdf(); open(tmp); });
                      } catch (Exception x) { runOnUiThread(() -> toast("Can't open file")); }
                  }).start();
              }

              void viewer(String name, View content) {
                  viewing = true;
                  LinearLayout v = new LinearLayout(this);
                  v.setOrientation(LinearLayout.VERTICAL);
                  TextView bar = tv("\u2190  " + name, 17, Color.WHITE, true);
                  bar.setBackgroundColor(ACC);
                  bar.setPadding(dp(16), dp(14), dp(16), dp(14));
                  bar.setSingleLine();
                  bar.setEllipsize(TextUtils.TruncateAt.END);
                  bar.setOnClickListener(x -> onBackPressed());
                  v.addView(bar);
                  v.addView(content, new LinearLayout.LayoutParams(-1, 0, 1));
                  setContentView(v);
              }

              void closePdf() {
                  if (pdf != null) synchronized (pdf) { try { pdf.close(); } catch (Exception e) { } pdf = null; }
              }

              @Override public void onBackPressed() {
                  if (viewing) { viewing = false; closePdf(); setContentView(root); }
                  else if (!libTab && !dir.equals(top) && dir.getParentFile() != null) { dir = dir.getParentFile(); refresh(); }
                  else super.onBackPressed();
              }

              void showPdf(File f) {
                  closePdf();
                  try { pdf = new PdfRenderer(ParcelFileDescriptor.open(f, ParcelFileDescriptor.MODE_READ_ONLY)); }
                  catch (Exception e) { toast("Can't open this PDF"); return; }
                  final PdfRenderer r = pdf;
                  ListView lv = new ListView(this);
                  lv.setBackgroundColor(0xFFCCCCCC);
                  lv.setDivider(new ColorDrawable(0xFFCCCCCC));
                  lv.setDividerHeight(dp(6));
                  lv.setFastScrollEnabled(true);
                  lv.setAdapter(new BaseAdapter() {
                      public int getCount() { return r.getPageCount(); }
                      public Object getItem(int i) { return null; }
                      public long getItemId(int i) { return i; }
                      public View getView(int i, View v, ViewGroup p) {
                          ImageView iv;
                          if (v == null) {
                              iv = new ImageView(MainActivity.this);
                              iv.setAdjustViewBounds(true);
                              iv.setLayoutParams(new AbsListView.LayoutParams(-1, -2));
                          } else iv = (ImageView) v;
                          synchronized (r) {
                              if (pdf != r) return iv;
                              PdfRenderer.Page pg = r.openPage(i);
                              int w = Math.min(getResources().getDisplayMetrics().widthPixels, 1100);
                              int h = w * pg.getHeight() / pg.getWidth();
                              Bitmap bm = Bitmap.createBitmap(w, h, Bitmap.Config.RGB_565);
                              bm.eraseColor(Color.WHITE);
                              pg.render(bm, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY);
                              pg.close();
                              iv.setImageBitmap(bm);
                          }
                          return iv;
                      }
                  });
                  viewer(f.getName(), lv);
              }

              void showText(File f, String e) {
                  TextView ld = tv("Loading\u2026", 16, 0xFF444444, false);
                  ld.setPadding(dp(16), dp(16), dp(16), dp(16));
                  viewer(f.getName(), ld);
                  new Thread(() -> {
                      String s;
                      try { s = parse(f, e); } catch (Throwable x) { s = "Can't read this file."; }
                      final String out = s.length() > 200000 ? s.substring(0, 200000) + "\n\n\u2026 (truncated)" : s;
                      runOnUiThread(() -> {
                          if (!viewing) return;
                          boolean x = e.equals("xlsx");
                          TextView tx = tv(out, x ? 13 : 17, 0xFF222222, false);
                          tx.setPadding(dp(16), dp(12), dp(16), dp(24));
                          tx.setLineSpacing(0, 1.15f);
                          ScrollView sv = new ScrollView(this);
                          if (x) {
                              tx.setTypeface(Typeface.MONOSPACE);
                              HorizontalScrollView h = new HorizontalScrollView(this);
                              h.addView(tx);
                              sv.addView(h);
                          } else sv.addView(tx);
                          viewer(f.getName(), sv);
                      });
                  }).start();
              }

              String parse(File f, String e) throws Exception {
                  ZipFile z = new ZipFile(f);
                  StringBuilder sb = new StringBuilder();
                  try {
                      if (e.equals("docx")) text(z.getInputStream(z.getEntry("word/document.xml")), sb);
                      else if (e.equals("pptx")) {
                          ArrayList<String> sl = new ArrayList<>();
                          for (Enumeration<? extends ZipEntry> en = z.entries(); en.hasMoreElements(); ) {
                              String n = en.nextElement().getName();
                              if (n.matches("ppt/slides/slide\\d+\\.xml")) sl.add(n);
                          }
                          Collections.sort(sl, (a, b) -> num(a) - num(b));
                          for (String n : sl) {
                              sb.append("\u2014 Slide ").append(num(n)).append(" \u2014\n");
                              text(z.getInputStream(z.getEntry(n)), sb);
                              sb.append('\n');
                          }
                      } else sheet(z, sb);
                  } finally { z.close(); }
                  return sb.toString();
              }

              static int num(String n) { return Integer.parseInt(n.replaceAll("\\D", "")); }

              static String local(String n) { int i = n.indexOf(':'); return i < 0 ? n : n.substring(i + 1); }

              static XmlPullParser pp(InputStream in) throws Exception {
                  XmlPullParser p = Xml.newPullParser();
                  p.setInput(in, null);
                  return p;
              }

              void text(InputStream in, StringBuilder sb) throws Exception {
                  XmlPullParser p = pp(in);
                  for (int t = p.getEventType(); t != XmlPullParser.END_DOCUMENT; t = p.next()) {
                      if (t == XmlPullParser.START_TAG) {
                          String n = local(p.getName());
                          if (n.equals("t")) sb.append(p.nextText());
                          else if (n.equals("tab")) sb.append('\t');
                          else if (n.equals("br")) sb.append('\n');
                      } else if (t == XmlPullParser.END_TAG && local(p.getName()).equals("p")) sb.append('\n');
                  }
              }

              static int colOf(String r, int dflt) {
                  if (r == null) return dflt;
                  int c = 0;
                  for (int i = 0; i < r.length(); i++) {
                      char ch = r.charAt(i);
                      if (ch < 'A' || ch > 'Z') break;
                      c = c * 26 + ch - 'A' + 1;
                  }
                  return c == 0 ? dflt : c - 1;
              }

              void sheet(ZipFile z, StringBuilder sb) throws Exception {
                  ArrayList<String> ss = new ArrayList<>();
                  ZipEntry e = z.getEntry("xl/sharedStrings.xml");
                  if (e != null) {
                      XmlPullParser p = pp(z.getInputStream(e));
                      StringBuilder c = new StringBuilder();
                      for (int t = p.getEventType(); t != XmlPullParser.END_DOCUMENT; t = p.next()) {
                          if (t == XmlPullParser.START_TAG) {
                              String n = local(p.getName());
                              if (n.equals("si")) c.setLength(0);
                              else if (n.equals("t")) c.append(p.nextText());
                          } else if (t == XmlPullParser.END_TAG && local(p.getName()).equals("si")) ss.add(c.toString());
                      }
                  }
                  ZipEntry s = z.getEntry("xl/worksheets/sheet1.xml");
                  if (s == null) for (Enumeration<? extends ZipEntry> en = z.entries(); en.hasMoreElements(); ) {
                      ZipEntry q = en.nextElement();
                      if (q.getName().startsWith("xl/worksheets/sheet")) { s = q; break; }
                  }
                  if (s == null) return;
                  XmlPullParser p = pp(z.getInputStream(s));
                  ArrayList<String> row = new ArrayList<>();
                  String typ = "";
                  int col = 0, rows = 0;
                  for (int t = p.getEventType(); t != XmlPullParser.END_DOCUMENT && rows < 3000; t = p.next()) {
                      if (t == XmlPullParser.START_TAG) {
                          String n = local(p.getName());
                          if (n.equals("row")) row.clear();
                          else if (n.equals("c")) {
                              typ = String.valueOf(p.getAttributeValue(null, "t"));
                              col = colOf(p.getAttributeValue(null, "r"), row.size());
                          } else if (n.equals("v") || n.equals("t")) {
                              String v = p.nextText();
                              if (typ.equals("s") && n.equals("v")) try { v = ss.get(Integer.parseInt(v.trim())); } catch (Exception x) { }
                              while (row.size() <= col && row.size() < 300) row.add("");
                              if (col < row.size()) row.set(col, row.get(col) + v);
                          }
                      } else if (t == XmlPullParser.END_TAG && local(p.getName()).equals("row")) {
                          sb.append(TextUtils.join("  \u2502  ", row)).append('\n');
                          rows++;
                      }
                  }
              }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: mv app/build/outputs/apk/debug/app-debug.apk PDXP.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pdxp-${{ github.run_number }}
          name: PDXP build ${{ github.run_number }}
          files: PDXP.apk
